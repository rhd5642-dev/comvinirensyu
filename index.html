<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 실전회화 말하기 연습 및 AI 트레이닝</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif; background-color: #f1f5f9; }
        .perspective-1000 { perspective: 1000px; }
        .card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .card-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        .pulse-ring { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); animation: pulse-ring-anim 1.5s infinite; }
        @keyframes pulse-ring-anim {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 bg-slate-100 select-none pb-12">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-indigo-600 p-2 rounded-2xl shadow-md font-bold text-xl flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg sm:text-xl tracking-tight leading-tight">일본어 실전회화 마스터</h1>
                    <p class="text-xs text-indigo-200">점원 & 손님 표현 통합 음성 연습 스튜디오</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="stats-toggle-btn" class="bg-indigo-700 hover:bg-indigo-800 text-white text-xs sm:text-sm font-semibold py-2 px-3 rounded-xl transition flex items-center space-x-1 shadow">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span class="hidden sm:inline">학습 현황/수정</span>
                </button>
                <button id="add-sentence-btn" class="bg-indigo-500 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold py-2 px-3 rounded-xl transition flex items-center space-x-1 shadow">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">문장 추가</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6 flex flex-col">
        <div class="bg-white rounded-2xl p-2 shadow-sm border border-slate-200 mb-6 overflow-x-auto">
            <nav class="flex space-x-2 min-w-max">
                <button data-mode="flashcard" class="mode-tab px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center space-x-2 bg-indigo-600 text-white shadow-sm">
                    <i class="fa-solid fa-clone"></i><span>1. 플래시카드</span>
                </button>
                <button data-mode="voice" class="mode-tab px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-600 hover:bg-slate-100 transition flex items-center space-x-2">
                    <i class="fa-solid fa-microphone text-rose-500"></i><span>2. AI 음성 발음 평가</span>
                </button>
                <button data-mode="puzzle" class="mode-tab px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-600 hover:bg-slate-100 transition flex items-center space-x-2">
                    <i class="fa-solid fa-puzzle-piece text-emerald-500"></i><span>3. 문장 조합 퀴즈</span>
                </button>
            </nav>
        </div>

        <!-- MODE 1: FLASHCARD -->
        <section id="sec-flashcard" class="mode-sec flex flex-col flex-grow">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center space-x-1 overflow-x-auto pb-1 sm:pb-0">
                        <button data-cat="ALL" class="cat-tab px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-indigo-600 text-white shadow-sm">전체 보기</button>
                        <button data-cat="1" class="cat-tab px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">점원 표현</button>
                        <button data-cat="2" class="cat-tab px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">손님 표현</button>
                    </div>
                    <div class="flex items-center space-x-3 text-xs sm:text-sm text-slate-600">
                        <label class="flex items-center space-x-1.5 cursor-pointer">
                            <input type="checkbox" id="shuffle-toggle" class="rounded text-indigo-600 w-4 h-4" checked>
                            <span class="font-medium">랜덤 섞기</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="mb-2 flex items-center justify-between text-xs sm:text-sm text-slate-500 font-bold px-1">
                <span id="progress-text">진행률: 0 / 0</span>
                <span id="mastered-count" class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>완료: 0</span>
            </div>
            <div class="w-full bg-slate-200 h-2 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300 w-0"></div>
            </div>

            <div class="perspective-1000 w-full mb-6 flex-grow min-h-[320px] relative">
                <div id="flashcard" class="card-inner w-full h-full min-h-[320px] relative rounded-3xl cursor-pointer">
                    <!-- Front -->
                    <div class="card-front absolute inset-0 bg-white rounded-3xl p-6 sm:p-10 shadow-md border border-slate-200 flex flex-col justify-between">
                        <span id="card-badge" class="w-max px-3 py-1 bg-indigo-50 text-indigo-600 font-bold text-xs rounded-full">점원 표현</span>
                        <div class="text-center my-auto">
                            <h2 id="korean-prompt" class="text-2xl sm:text-3xl font-black text-slate-900 leading-snug">-</h2>
                        </div>
                        <div class="text-center">
                            <span class="text-xs text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-full">터치하여 정답 확인하기</span>
                        </div>
                    </div>

                    <!-- Back -->
                    <div class="card-back absolute inset-0 bg-gradient-to-br from-slate-900 to-indigo-950 text-white rounded-3xl p-6 sm:p-10 shadow-xl flex flex-col justify-between">
                        <div class="flex justify-between items-start">
                            <span class="px-3 py-1 bg-white/10 text-indigo-200 font-bold text-xs rounded-full">정답</span>
                            <button id="tts-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white p-2 rounded-xl text-xs font-bold flex items-center space-x-1">
                                <i class="fa-solid fa-volume-high"></i><span>발음 듣기</span>
                            </button>
                        </div>
                        <div class="text-center my-auto space-y-3">
                            <h3 id="jp-text" class="text-2xl sm:text-3xl font-black text-white">-</h3>
                            <p id="hiragana-text" class="text-lg font-bold text-emerald-300">-</p>
                            <p id="korean-pron-text" class="text-xl font-black text-amber-300">-</p>
                        </div>
                        <div class="text-center text-xs text-indigo-300">카드를 터치하면 문제로 돌아갑니다</div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <button id="know-btn" class="py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm sm:text-base rounded-2xl shadow transition">
                    <i class="fa-solid fa-circle-check mr-1"></i>알고 있어요
                </button>
                <button id="retry-btn" class="py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm sm:text-base rounded-2xl shadow transition">
                    <i class="fa-solid fa-rotate-left mr-1"></i>다시 할게요
                </button>
            </div>

            <div class="flex items-center justify-between bg-white px-4 py-3 rounded-2xl border border-slate-200 text-slate-600 text-sm">
                <button id="prev-btn" class="font-bold hover:text-indigo-600"><i class="fa-solid fa-chevron-left mr-1"></i>이전</button>
                <button id="toggle-flip-btn" class="text-indigo-600 font-bold bg-indigo-50 px-4 py-1.5 rounded-xl"><span id="flip-btn-text">정답 보기</span></button>
                <button id="next-btn" class="font-bold hover:text-indigo-600">다음<i class="fa-solid fa-chevron-right ml-1"></i></button>
            </div>
        </section>

        <!-- MODE 2: VOICE -->
        <section id="sec-voice" class="mode-sec hidden flex flex-col flex-grow">
            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 text-center max-w-2xl mx-auto w-full">
                <h3 id="v-korean" class="text-2xl font-black text-slate-900 mb-2">-</h3>
                <p id="v-target-jp" class="text-lg font-bold text-indigo-600 mb-6">-</p>
                <div class="my-6 flex flex-col items-center">
                    <button id="v-mic-btn" class="w-20 h-20 bg-rose-500 text-white rounded-full flex flex-col items-center justify-center shadow-lg active:scale-95">
                        <i class="fa-solid fa-microphone text-2xl mb-1"></i>
                        <span class="text-[10px] font-bold">말하기</span>
                    </button>
                    <span id="v-status-msg" class="text-xs font-bold text-slate-500 mt-3">버튼을 누르고 말씀하세요</span>
                </div>
                <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 text-left mb-6">
                    <div class="flex justify-between text-xs font-bold text-slate-500 mb-1">
                        <span>인식된 발음:</span><span id="v-score-badge" class="px-2 py-0.5 bg-slate-200 rounded">대기 중</span>
                    </div>
                    <p id="v-user-said" class="text-base font-bold text-slate-800 min-h-[24px]">"음성 버튼을 누르세요"</p>
                </div>
                <button id="v-next-btn" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow">다음 문장으로</button>
            </div>
        </section>

        <!-- MODE 3: PUZZLE -->
        <section id="sec-puzzle" class="mode-sec hidden flex flex-col flex-grow">
            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 max-w-2xl mx-auto w-full text-center">
                <h3 id="puz-korean" class="text-2xl font-black text-slate-900 mb-4">-</h3>
                <div class="min-h-[60px] bg-slate-50 border-2 border-dashed border-emerald-300 rounded-2xl p-3 flex flex-wrap items-center justify-center gap-2 mb-6" id="puz-answer-box"></div>
                <div class="flex flex-wrap items-center justify-center gap-2 mb-6" id="puz-pool-box"></div>
                <div class="flex justify-between">
                    <button id="puz-reset-btn" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl">다시 맞추기</button>
                    <button id="puz-check-btn" class="px-6 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow">정답 확인</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal: Add & Edit -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-lg font-black mb-4">문장 추가/수정</h3>
            <form id="add-sentence-form" class="space-y-3">
                <input type="hidden" id="input-edit-id">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">카테고리</label>
                    <select id="input-category" class="w-full bg-slate-50 border p-2 rounded-xl text-sm">
                        <option value="1">점원 표현</option>
                        <option value="2">손님 표현</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">한국어 뜻</label>
                    <input type="text" id="input-korean" required class="w-full bg-slate-50 border p-2 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">일본어 문장</label>
                    <input type="text" id="input-japanese" required class="w-full bg-slate-50 border p-2 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">히라가나</label>
                    <input type="text" id="input-hiragana" required class="w-full bg-slate-50 border p-2 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">한글 발음</label>
                    <input type="text" id="input-korean-pron" required class="w-full bg-slate-50 border p-2 rounded-xl text-sm">
                </div>
                <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" id="cancel-add-modal" class="px-4 py-2 bg-slate-100 text-slate-600 font-bold text-sm rounded-xl">취소</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white font-bold text-sm rounded-xl">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Stats Modal -->
    <div id="stats-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <h3 class="text-lg font-black mb-4">문장 목록 및 관리</h3>
            <div id="sentence-list-container" class="flex-grow overflow-y-auto space-y-2 pr-1"></div>
            <div class="pt-4 border-t flex justify-end mt-2">
                <button id="close-stats-modal-btn" class="px-5 py-2 bg-indigo-600 text-white font-bold text-sm rounded-xl">닫기</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        // 1단계에서 새로 배포한 Web App URL 주소로 꼭 교체해 주세요!
        const GAS_CONV_URL = "https://script.google.com/macros/s/AKfycbxlQYPLUiCoGLYm0ZDq8ev8y1LtY-tcONJXukqh1OURI3jQzUZ4ZwYQEPQrT1IsGozx5w/exec";

        let sentences = [
            { id: 1, category: "1", korean: "어서 오세요.", japanese: "いらっしゃいませ。", hiragana: "いらっしゃいませ。", koreanPron: "이랏샤이마세" },
            { id: 2, category: "1", korean: "다음 손님, 이쪽으로 오세요", japanese: "つぎの かた、 こちらへ どうぞ", hiragana: "つぎの かた、 こちらへ どうぞ", koreanPron: "츠기노 카타, 코치라에 도-조" },
            { id: 3, category: "2", korean: "실례합니다.", japanese: "すみません。", hiragana: "すみません。", koreanPron: "스미마셍" }
        ];

        let filteredSentences = [];
        let currentIndex = 0;
        let isFlipped = false;
        let activeCategory = "ALL";
        let isShuffle = true;
        let masteredIds = new Set();

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if (recognition) recognition.lang = 'ja-JP';

        async function loadSentencesFromGAS() {
            if (!GAS_CONV_URL) return;
            try {
                const res = await fetch(GAS_CONV_URL);
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    sentences = data;
                    showToast("구글 시트 동기화 완료!", "success");
                }
            } catch (err) {
                console.warn("GAS 동기화 대기 중 (기본 데이터로 구동합니다)");
            }
        }

        async function saveSentencesToGAS() {
            if (!GAS_CONV_URL) return;
            showToast("구글 시트에 저장 중...", "info");
            try {
                await fetch(GAS_CONV_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'saveAllSentences', sentences: sentences })
                });
                showToast("구글 시트 저장 완료!", "success");
            } catch (err) {
                console.error("저장 실패", err);
            }
        }

        function initApp() {
            setupEvents();
            applyCategoryFilter("ALL");
            loadSentencesFromGAS().then(() => applyCategoryFilter(activeCategory));
        }

        function setupEvents() {
            // Mode Switch
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const mode = e.currentTarget.getAttribute('data-mode');
                    document.querySelectorAll('.mode-tab').forEach(btn => {
                        btn.className = "mode-tab px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-600 hover:bg-slate-100 transition flex items-center space-x-2";
                    });
                    e.currentTarget.className = "mode-tab px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center space-x-2 bg-indigo-600 text-white shadow-sm";

                    document.querySelectorAll('.mode-sec').forEach(sec => sec.classList.add('hidden'));
                    document.getElementById(`sec-${mode}`).classList.remove('hidden');

                    if (mode === "voice") loadVoiceTarget();
                    if (mode === "puzzle") loadPuzzleTarget();
                });
            });

            // Card Events
            document.getElementById('flashcard').onclick = (e) => {
                if (e.target.closest('#tts-btn')) return;
                flipCard();
            };
            document.getElementById('toggle-flip-btn').onclick = flipCard;
            document.getElementById('tts-btn').onclick = (e) => { e.stopPropagation(); playSpeech(filteredSentences[currentIndex]?.japanese); };

            document.getElementById('prev-btn').onclick = () => {
                if (!filteredSentences.length) return;
                currentIndex = (currentIndex - 1 + filteredSentences.length) % filteredSentences.length;
                updateCardDisplay();
            };
            document.getElementById('next-btn').onclick = () => {
                if (!filteredSentences.length) return;
                currentIndex = (currentIndex + 1) % filteredSentences.length;
                updateCardDisplay();
            };
            document.getElementById('know-btn').onclick = () => {
                if (!filteredSentences.length) return;
                masteredIds.add(filteredSentences[currentIndex].id);
                currentIndex = (currentIndex + 1) % filteredSentences.length;
                updateCardDisplay();
            };
            document.getElementById('retry-btn').onclick = () => {
                if (!filteredSentences.length) return;
                currentIndex = (currentIndex + 1) % filteredSentences.length;
                updateCardDisplay();
            };

            // Category Filter
            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.onclick = (e) => {
                    document.querySelectorAll('.cat-tab').forEach(b => {
                        b.className = "cat-tab px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200";
                    });
                    e.currentTarget.className = "cat-tab px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-indigo-600 text-white shadow-sm";
                    applyCategoryFilter(e.currentTarget.getAttribute('data-cat'));
                };
            });

            document.getElementById('shuffle-toggle').onchange = (e) => {
                isShuffle = e.target.checked;
                applyCategoryFilter(activeCategory);
            };

            // Modal & Sentence Edit
            const addModal = document.getElementById('add-modal');
            document.getElementById('add-sentence-btn').onclick = () => openSentenceModal();
            document.getElementById('cancel-add-modal').onclick = () => addModal.classList.add('hidden');

            document.getElementById('add-sentence-form').onsubmit = async (e) => {
                e.preventDefault();
                const editId = document.getElementById('input-edit-id').value;
                const newSentence = {
                    id: editId ? Number(editId) : Date.now(),
                    category: document.getElementById('input-category').value,
                    korean: document.getElementById('input-korean').value.trim(),
                    japanese: document.getElementById('input-japanese').value.trim(),
                    hiragana: document.getElementById('input-hiragana').value.trim(),
                    koreanPron: document.getElementById('input-korean-pron').value.trim()
                };

                if (editId) {
                    const idx = sentences.findIndex(s => s.id === Number(editId));
                    if (idx !== -1) sentences[idx] = newSentence;
                } else {
                    sentences.push(newSentence);
                }

                addModal.classList.add('hidden');
                document.getElementById('add-sentence-form').reset();
                applyCategoryFilter(activeCategory);
                await saveSentencesToGAS();
            };

            const statsModal = document.getElementById('stats-modal');
            document.getElementById('stats-toggle-btn').onclick = openStatsModal;
            document.getElementById('close-stats-modal-btn').onclick = () => statsModal.classList.add('hidden');

            // Voice Recognition
            setupVoiceEvents();
            setupPuzzleEvents();
        }

        function applyCategoryFilter(cat) {
            activeCategory = cat;
            filteredSentences = (cat === "ALL") ? [...sentences] : sentences.filter(s => s.category === cat);
            if (isShuffle && filteredSentences.length > 0) filteredSentences.sort(() => 0.5 - Math.random());
            currentIndex = 0;
            isFlipped = false;
            updateCardDisplay();
        }

        function updateCardDisplay() {
            if (isFlipped) {
                document.getElementById('flashcard').classList.remove('card-flipped');
                isFlipped = false;
                document.getElementById('flip-btn-text').innerText = "정답 보기";
            }

            document.getElementById('mastered-count').innerText = `완료: ${masteredIds.size}`;
            const total = filteredSentences.length;

            if (total === 0) {
                document.getElementById('progress-text').innerText = "진행률: 0 / 0";
                document.getElementById('progress-bar').style.width = "0%";
                document.getElementById('korean-prompt').innerText = "문장이 없습니다";
                return;
            }

            document.getElementById('progress-text').innerText = `진행률: ${currentIndex + 1} / ${total}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / total) * 100}%`;

            const cur = filteredSentences[currentIndex];
            document.getElementById('korean-prompt').innerText = cur.korean;
            document.getElementById('jp-text').innerText = cur.japanese;
            document.getElementById('hiragana-text').innerText = cur.hiragana;
            document.getElementById('korean-pron-text').innerText = cur.koreanPron;
            document.getElementById('card-badge').innerText = cur.category === "1" ? "점원 표현" : "손님 표현";
        }

        function flipCard() {
            if (!filteredSentences.length) return;
            isFlipped = !isFlipped;
            const fc = document.getElementById('flashcard');
            if (isFlipped) {
                fc.classList.add('card-flipped');
                document.getElementById('flip-btn-text').innerText = "문제 보기";
            } else {
                fc.classList.remove('card-flipped');
                document.getElementById('flip-btn-text').innerText = "정답 보기";
            }
        }

        function playSpeech(text) {
            if ('speechSynthesis' in window && text) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ja-JP';
                window.speechSynthesis.speak(utter);
            }
        }

        let vIndex = 0;
        function setupVoiceEvents() {
            const micBtn = document.getElementById('v-mic-btn');
            micBtn.onclick = () => {
                if (!recognition) return showToast("지원하지 않는 브라우저입니다.", "error");
                micBtn.classList.add('pulse-ring');
                document.getElementById('v-status-msg').innerText = "듣고 있습니다...";
                recognition.start();

                recognition.onresult = (e) => {
                    micBtn.classList.remove('pulse-ring');
                    const res = e.results[0][0].transcript;
                    document.getElementById('v-user-said').innerText = `"${res}"`;
                    document.getElementById('v-score-badge').innerText = "인식 완료";
                    document.getElementById('v-status-msg').innerText = "확인 완료!";
                };
                recognition.onerror = () => micBtn.classList.remove('pulse-ring');
            };
            document.getElementById('v-next-btn').onclick = () => {
                vIndex = (vIndex + 1) % sentences.length;
                loadVoiceTarget();
            };
        }

        function loadVoiceTarget() {
            if (!sentences.length) return;
            const item = sentences[vIndex];
            document.getElementById('v-korean').innerText = item.korean;
            document.getElementById('v-target-jp').innerText = `${item.japanese} (${item.koreanPron})`;
        }

        let puzIndex = 0;
        let selectedBlocks = [];
        function setupPuzzleEvents() {
            document.getElementById('puz-reset-btn').onclick = loadPuzzleTarget;
            document.getElementById('puz-check-btn').onclick = () => {
                const ans = selectedBlocks.map(b => b.text).join("");
                if (ans === sentences[puzIndex].japanese.replace(/\s+/g, '')) {
                    showToast("정답입니다!", "success");
                    puzIndex = (puzIndex + 1) % sentences.length;
                    setTimeout(loadPuzzleTarget, 1000);
                } else {
                    showToast("다시 도전해 보세요!", "error");
                }
            };
        }

        function loadPuzzleTarget() {
            if (!sentences.length) return;
            const item = sentences[puzIndex];
            document.getElementById('puz-korean').innerText = item.korean;
            
            const chars = item.japanese.match(/[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]+|[。？]/g) || [item.japanese];
            selectedBlocks = [];
            
            const pool = document.getElementById('puz-pool-box');
            const ansBox = document.getElementById('puz-answer-box');
            pool.innerHTML = '';
            ansBox.innerHTML = '';

            const shuffled = chars.map((c, i) => ({ text: c, id: i })).sort(() => 0.5 - Math.random());
            shuffled.forEach(obj => {
                const btn = document.createElement('button');
                btn.className = "px-3 py-1.5 bg-indigo-50 border border-indigo-200 text-indigo-900 rounded-xl font-bold text-sm";
                btn.innerText = obj.text;
                btn.onclick = () => {
                    selectedBlocks.push(obj);
                    btn.style.display = 'none';
                    const slot = document.createElement('button');
                    slot.className = "px-3 py-1.5 bg-emerald-600 text-white rounded-xl font-bold text-sm";
                    slot.innerText = obj.text;
                    slot.onclick = () => {
                        slot.remove();
                        selectedBlocks = selectedBlocks.filter(b => b.id !== obj.id);
                        btn.style.display = 'inline-block';
                    };
                    ansBox.appendChild(slot);
                };
                pool.appendChild(btn);
            });
        }

        function openSentenceModal(sentenceObj = null) {
            const modal = document.getElementById('add-modal');
            if (sentenceObj) {
                document.getElementById('input-edit-id').value = sentenceObj.id;
                document.getElementById('input-category').value = sentenceObj.category;
                document.getElementById('input-korean').value = sentenceObj.korean;
                document.getElementById('input-japanese').value = sentenceObj.japanese;
                document.getElementById('input-hiragana').value = sentenceObj.hiragana;
                document.getElementById('input-korean-pron').value = sentenceObj.koreanPron;
            } else {
                document.getElementById('add-sentence-form').reset();
                document.getElementById('input-edit-id').value = "";
            }
            modal.classList.remove('hidden');
        }

        function openStatsModal() {
            const container = document.getElementById('sentence-list-container');
            container.innerHTML = '';
            sentences.forEach(s => {
                const item = document.createElement('div');
                item.className = "p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs";
                item.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800">${s.korean}</div>
                        <div class="text-slate-500">${s.japanese} (${s.koreanPron})</div>
                    </div>
                    <button onclick='openSentenceModal(${JSON.stringify(s)})' class="px-2 py-1 bg-amber-100 text-amber-700 font-bold rounded">수정</button>
                `;
                container.appendChild(item);
            });
            document.getElementById('stats-modal').classList.remove('hidden');
        }

        function showToast(msg, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold text-white transition-all ${type === 'success' ? 'bg-emerald-600' : 'bg-slate-800'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        window.onload = initApp;
    </script>
</body>
</html>
